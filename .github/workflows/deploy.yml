name: Deploy OSINT course

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'docusaurus.config.js'
      - 'sidebars.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: osint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Docusaurus site
        shell: bash
        run: |
          set -o pipefail
          time npm run build

      - name: Validate Pages output
        shell: bash
        run: |
          test -f build/index.html
          test -f build/sitemap.xml
          test -f build/CNAME
          test -d build/course
          echo "Validated $(find build -type f | wc -l) generated files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

  verify:
    name: Verify deployed course
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      statuses: write
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Smoke-test published routes
        shell: bash
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}/"
          routes=("" "course/welcome/" "resources/")

          for route in "${routes[@]}"; do
            url="${base_url}${route}"
            output="/tmp/osint-${route//\//-}.html"
            echo "Checking ${url}"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 10 \
              --connect-timeout 10 \
              --max-time 30 \
              "${url}" \
              --output "${output}"
            grep -qi '<!doctype html' "${output}"
            grep -qi 'OSINT' "${output}"
          done

      - name: Publish successful deployment status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(printf '{"state":"success","target_url":"%s","description":"Pages deployment and route smoke tests passed","context":"deployment/osint-pages"}' "${PAGE_URL}")
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"

      - name: Publish failed deployment status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(printf '{"state":"failure","target_url":"%s","description":"Pages deployment or route smoke test failed","context":"deployment/osint-pages"}' "${PAGE_URL}")
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
