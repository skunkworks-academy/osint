name: Deploy OSINT enrolment gateway

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'docusaurus.config.js'
      - 'sidebars.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: osint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build protected-course gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Docusaurus site
        shell: bash
        run: |
          set -o pipefail
          time npm run build

      - name: Validate access boundary and Pages output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/sitemap.xml
          test -f build/CNAME
          test -f build/enrol/index.html
          test -f build/login/index.html
          test -f build/course/index.html
          test -f build/dashboard/index.html
          test -f build/resources/index.html

          # No lesson body may be included in the public deployment artifact.
          test ! -e build/course/welcome/index.html
          test ! -e build/course/guardrails/index.html
          test ! -e build/course/workflow/overview/index.html
          test ! -e build/course/assessment/final-assessment/index.html

          grep -qi 'Enrol in OSINT-101' build/index.html
          grep -qi 'Account and enrolment required' build/enrol/index.html
          grep -qi 'Protected learning area' build/course/index.html
          echo "Validated $(find build -type f | wc -l) public gateway files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

  verify:
    name: Verify enrolment gateway
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Smoke-test public and gated routes
        shell: bash
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}/"

          check_route() {
            local route="$1"
            local expected="$2"
            local url="${base_url}${route}"
            local output="/tmp/osint-${route//\//-}.html"

            for attempt in $(seq 1 24); do
              echo "Checking ${url} (attempt ${attempt}/24)"
              status=$(curl \
                --silent \
                --show-error \
                --location \
                --connect-timeout 10 \
                --max-time 30 \
                --output "${output}" \
                --write-out '%{http_code}' \
                "${url}" || true)

              if [[ "${status}" == "200" ]] \
                && grep -qi '<!doctype html' "${output}" \
                && grep -qi "${expected}" "${output}"; then
                return 0
              fi

              sleep 10
            done

            echo "Expected content did not propagate to ${url}." >&2
            return 1
          }

          check_route "" "Enrol in OSINT-101"
          check_route "enrol/" "Account and enrolment required"
          check_route "login/" "Protected learning area"
          check_route "course/" "Protected learning area"
          check_route "dashboard/" "Protected learning area"
          check_route "resources/" "Protected learning area"

          # CDN propagation may briefly serve the previous lesson page. Retry until the
          # route is missing or it no longer contains the former lesson body.
          legacy_url="${base_url}course/welcome/"
          legacy_output="/tmp/osint-legacy-welcome.html"
          legacy_removed=false

          for attempt in $(seq 1 24); do
            echo "Checking retired lesson route ${legacy_url} (attempt ${attempt}/24)"
            legacy_status=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --output "${legacy_output}" \
              --write-out '%{http_code}' \
              "${legacy_url}" || true)

            if [[ "${legacy_status}" != "200" ]]; then
              legacy_removed=true
              break
            fi

            if ! grep -Eqi 'Welcome to OSINT Investigation Methodology|Finding what is already there|Course standard' "${legacy_output}"; then
              legacy_removed=true
              break
            fi

            sleep 10
          done

          if [[ "${legacy_removed}" != "true" ]]; then
            echo 'The retired lesson body remains publicly available after propagation retries.' >&2
            exit 1
          fi

      - name: Publish successful deployment status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(printf '{"state":"success","target_url":"%s","description":"Enrolment gateway deployed; protected lesson content excluded","context":"deployment/osint-pages"}' "${PAGE_URL}")
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"

      - name: Publish failed deployment status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload=$(printf '{"state":"failure","target_url":"%s","description":"Enrolment gateway deployment or access-boundary test failed","context":"deployment/osint-pages"}' "${PAGE_URL}")
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
