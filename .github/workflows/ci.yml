name: Validate OSINT course

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'docusaurus.config.js'
      - 'sidebars.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osint-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build Docusaurus site
        shell: bash
        run: |
          set -o pipefail
          time npm run build 2>&1 | tee build.log

      - name: Validate generated site
        shell: bash
        run: |
          test -f build/index.html
          test -f build/sitemap.xml
          test -f build/CNAME
          test -d build/course
          echo "Generated $(find build -type f | wc -l) files"

      - name: Retain failed build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: osint-build-failure-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7
